[project]
name = "pyantz"
dynamic = ["version"]
description = "Job runner for small projects"
readme = "README.md"
authors = [
    { name = "igreen1", email = "pyantz@iangreen.dev" }
]
requires-python = ">=3.13"
dependencies = [
    "docker>=7.1.0",
    "fastapi[standard]>=0.127.0",
    "paramiko>=4.0.0",
    "polars>=1.36.1",
    "pydantic>=2.11.7",
    "ruamel-yaml>=0.19.1",
    "sqlalchemy>=2.0.42",
]

[project.urls]
# the docs on GitHub Pages, deployed by .github/workflows/ci.yml
Documentation = "https://iangreen.dev/pyantz/"

[project.optional-dependencies]
# reading excel files (pyantz.jobs.files.reformat.excel_to_csv)
excel = ["fastexcel>=0.12.0"]
# the web ui, built (packages/pyantz-frontend); start it with `pyantz-frontend`
frontend = ["pyantz-frontend==2.0.1"]

[project.scripts]
pyantz = "pyantz.__main__:main"
pyantz-status = "pyantz.status:main"
pyantz-dev = "pyantz.api.dev_server:start_dev_server"
pyantz-prod = "pyantz.api.backend:start_prod_server"
pyantz-frontend = "pyantz.api.frontend_server:start_frontend_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pyantz/__init__.py"

[tool.hatch.build]
exclude = [
  "/frontend",
  "/packages",
  "/slurm_setup",
  "/tests",           # Exclude a top-level directory
]

[tool.uv.workspace]
members = ["packages/pyantz-frontend"]

[tool.uv.sources]
pyantz-frontend = { workspace = true }

[dependency-groups]
api = [
    "fastapi[standard]>=0.127.0",
]
dev = [
    "autodoc-pydantic>=2.2.0",
    "bandit>=1.9.4",
    "codespell>=2.4.1",
    "hypothesis>=6.151.10",
    "mypy>=1.17.1",
    "polars[excel]>=1.39.3",
    "pylint>=4.0.4",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.10",
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.13.8",
    "sphinx-book-theme>=1.2.0",
    "ty>=0.0.4",
    "types-docker>=7.1.0.20260402",
    "types-paramiko>=5.0.0.20261021",
]

[tool.ruff.lint.isort]
# python 3.13 evaluates annotations eagerly; this keeps type-checking-only
# imports in annotations working there as they do with 3.14's deferred ones
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
# Ignore S101 (assert statements) in the "tests" directory and all subdirectories
"tests/**/*.py" = ["S101", "S607", "S603"]
# examples are standalone scripts which print and use /tmp for sample data
"examples/**/*.py" = ["INP001", "T201", "S108"]
# a hatch build hook is a script next to the pyproject, not part of a package
"packages/*/hatch_build.py" = ["INP001"]
# sphinx's configuration is a script in the docs, not part of a package
"docs/source/conf.py" = ["INP001"]

[tool.ruff.lint]
select = ["ALL"]
# CPY001: the source files carry no copyright notice
ignore = ["D203", "D213", "COM812", "CPY001"]

[tool.pylint.main]
ignore-paths = ["^tests/*"]

[tool.pylint.format]
# the docstrings' examples make modules long; ruff checks the length of lines
max-module-lines = 1500

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "E0601",
    "E0602",
    # ruff enforces these (with `noqa` for the deliberate exceptions), so pylint
    # would only repeat it without seeing the `noqa` comments
    "line-too-long",  # E501
    "broad-exception-caught",  # BLE001: allowed when the exception is logged
    "import-outside-toplevel",  # PLC0415: imports done late to break cycles
    "unused-import",  # F401: `import pyantz.jobs` registers the jobs
    # ruff's TRY300 asks for the `else` of try/except, which these reject
    "no-else-return",
    "no-else-raise",
    # pyantz -> runner -> _remotes -> pyantz (for its version), imported in the
    # function which needs it, so the cycle never happens at import time
    "cyclic-import",
]

[tool.bumpver]
current_version = "2.0.1"
version_pattern = "MAJOR.MINOR.PATCH[-TAG]"
commit_message = "bump version {old_version} -> {new_version}"
tag_message = "{new_version}"
tag_scope = "default"
pre_commit_hook = ""
post_commit_hook = ""
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    '"pyantz-frontend=={version}"',
]
"packages/pyantz-frontend/pyproject.toml" = [
    '^version = "{version}"$',
]
"src/pyantz/__init__.py" = [
    '^__version__ = "{version}"$',
]

[tool.pytest.ini_options]
markers = [
    "docker: needs a docker daemon (skipped when there is none)",
    "ssh: needs an ssh server (skipped when it can't be reached)",
    "slow: takes more than a few seconds",
    "frontend: runs the frontend with node (skipped when node is too old or missing)",
]
