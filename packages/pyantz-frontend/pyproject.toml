[project]
name = "pyantz-frontend"
version = "2.0.2"
description = "The built web ui of pyantz; install it with `pip install pyantz[frontend]`"
readme = "README.md"
authors = [
    { name = "igreen1", email = "pyantz@iangreen.dev" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyantz_frontend"]

[tool.hatch.build]
# the build output is not in git, but it is the point of this package
artifacts = ["src/pyantz_frontend/static"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
