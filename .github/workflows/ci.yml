name: CI

on:
  push:
    branches: [master, test-all-platforms]  # TEMP: CI for the test-all-platforms branch
    # versions are tagged without a "v" (bumpver's tag_message), e.g. 2.0.1
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff, pylint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - name: ruff format
        run: uv run ruff format --check
      - name: ruff check
        run: uv run ruff check
      - name: pylint
        run: uv run pylint src

  typecheck:
    name: Type check (ty, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - name: ty
        run: uv run ty check
      - name: mypy
        run: uv run mypy src

  test:
    name: pytest (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python }}
      # tests/frontend run the typescript of the frontend with node
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: uv sync --locked
      # not with -n auto: tests/integrated/branching/test_if_else.py parametrizes
      # randomly, so xdist workers collect different tests
      - run: uv run pytest

  docs:
    name: Doctests and Sphinx docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - name: doctest
        working-directory: docs
        run: uv run make doctest
      - name: build html
        working-directory: docs
        # -W: warnings (broken references, bad rst in docstrings) fail the build
        run: uv run make html SPHINXOPTS="-W --keep-going"

  # the published docs are built from the release's tag, so they show the
  # version the bump made, not the one before it
  build-docs:
    name: Build the docs of the release
    if: needs.bump.outputs.tag != ''
    needs: [bump]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.bump.outputs.tag }}
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - name: build html
        working-directory: docs
        run: uv run make html SPHINXOPTS="-W --keep-going"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build/html

  deploy-docs:
    name: Publish docs to GitHub Pages
    needs: [build-docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/pyantz
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/pyantz/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/pyantz
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/pyantz/package-lock.json
      - run: uv sync --locked
        working-directory: .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: frontend/pyantz/test-results

  # every push to master which passes the checks is released as a new patch
  # version. The bump is pushed with the GITHUB_TOKEN, which starts no workflow,
  # so it doesn't bump again: this run releases it.
  bump:
    name: Bump the version and tag it
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master'
      && !startsWith(github.event.head_commit.message, 'bump version ')
    needs: [lint, typecheck, test, docs, frontend, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      # master, not this run's commit: the bump goes on top of master, and the
      # newer push (whose run waits for this one) releases it instead
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: astral-sh/setup-uv@v10.3.2
      - id: bump
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "master moved on from $GITHUB_SHA: its own run releases it"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uvx bumpver==2026.1132 update --patch --no-commit --no-tag-commit --no-push
          # uv.lock has the version of pyantz-frontend, which bumpver doesn't edit
          uv lock
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/pyantz/__init__.py)"
          git commit -am "bump version $(git show HEAD:src/pyantz/__init__.py | sed -n 's/^__version__ = "\(.*\)"$/\1/p') -> $version"
          git tag -a "$version" -m "$version"
          git push --atomic origin HEAD:master "refs/tags/$version"
          echo "tag=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build packages
    # a tag pushed by hand, or the one the bump made
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure')
      && (startsWith(github.ref, 'refs/tags/') || needs.bump.outputs.tag != '')
    needs: [lint, typecheck, test, docs, frontend, e2e, bump]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=${{ needs.bump.outputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
      - uses: astral-sh/setup-uv@v10.3.2
      # the pyantz-frontend package builds the web ui with npm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/pyantz/package-lock.json
      - name: check the tag is the package's version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/pyantz/__init__.py)"
          if [ "$version" != "$TAG" ]; then
            echo "::error::tag $TAG is not the package version $version"
            exit 1
          fi
      - name: build pyantz and pyantz-frontend
        run: uv build --all-packages
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release create --verify-tag needs the repository
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: create the release with the built packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: >
          gh release create "$TAG" dist/*
          --title "$TAG"
          --generate-notes
          --verify-tag

  publish-pypi:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    # trusted publishing: PyPI trusts this workflow and environment, no token
    environment:
      name: pypi
      url: https://pypi.org/project/pyantz/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # uploads both pyantz and pyantz-frontend, each to its own project
      - uses: pypa/gh-action-pypi-publish@release/v1
